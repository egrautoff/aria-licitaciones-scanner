# Temporal: averigua que combinacion de encabezados acepta el endpoint que
# dispara la rutina. Se borra apenas se sepa. Solo imprime codigos HTTP y
# cuerpos de error, nunca el token.
name: Diagnostico de autenticacion

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probar variantes de encabezados
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ID: trig_01TYWswpG56dfVXbizXAckku
        run: |
          probar() {
            nombre="$1"; shift
            c=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST "$@" \
              "https://api.anthropic.com/v1/code/triggers/$ID/run" || echo "000")
            cuerpo=$(head -c 160 /tmp/r.json | tr -d '\n')
            printf '%-46s HTTP %s  %s\n' "$nombre" "$c" "$cuerpo"
          }
          echo "crudo:   largo ${#T}  primeros4=[$(printf %.4s "$T")]"
          T=$(printf '%s' "$T" | tr -d '[:space:]')
          echo "limpio:  largo ${#T}  primeros4=[$(printf %.4s "$T")]"
          echo
          probar "bearer + beta oauth" \
            -H "Authorization: Bearer $T" -H "anthropic-beta: oauth-2025-04-20"
          probar "bearer + beta oauth + version" \
            -H "Authorization: Bearer $T" -H "anthropic-beta: oauth-2025-04-20" -H "anthropic-version: 2023-06-01"
          probar "bearer solo" \
            -H "Authorization: Bearer $T"
          probar "x-api-key + version" \
            -H "x-api-key: $T" -H "anthropic-version: 2023-06-01"
          probar "x-api-key + beta oauth" \
            -H "x-api-key: $T" -H "anthropic-beta: oauth-2025-04-20"
          echo
          echo "--- lectura (GET) con la mejor apuesta, para separar auth de permisos ---"
          c=$(curl -sS -o /tmp/g.json -w '%{http_code}' \
            -H "Authorization: Bearer $T" -H "anthropic-beta: oauth-2025-04-20" \
            "https://api.anthropic.com/v1/code/triggers/$ID")
          echo "GET trigger -> HTTP $c"
          head -c 200 /tmp/g.json | tr -d '\n'; echo
