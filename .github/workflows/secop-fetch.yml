name: SECOP fetch

on:
  schedule:
    - cron: "0 9 * * *" # 04:00 America/Bogota (UTC-5)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and filter SECOP II
        run: node scripts/fetch-secop.mjs

      - name: Commit updated data
        run: |
          git config user.name "secop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "chore: actualizar licitaciones SECOP $(date -u +%Y-%m-%d)"
          git push
