name: SECOP fetch

on:
  # Las dos corridas del dia (6:00 y 14:00 Bogota) las dispara cron-job.org con
  # workflow_dispatch, que arranca al instante: el schedule de GitHub llegaba con
  # 8 a 16 horas de atraso. Erwin necesita las dos publicaciones: la de la manana
  # para ver temprano las licitaciones y la de la tarde para revisar lo que salio
  # ese dia.
  #
  # Este schedule es solo el RESPALDO de la corrida de la manana: si ya hay dato
  # de hoy, el paso "Respaldo" lo detecta y no hace nada. Va a las 13:23 UTC
  # (8:23 Bogota) y no de madrugada: si GitHub algun dia lo arranca puntual, no
  # debe adelantarse a la corrida de las 6:00 y duplicar el correo.
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Si GitHub atrasa tanto la primera pasada que se cruza con la segunda, que
# esperen en fila en vez de pisarse al hacer push.
concurrency:
  group: secop-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Solo en el respaldo programado: si cron-job.org ya corrio hoy, no se hace
      # nada (ni datos, ni publicacion, ni correo). En los arranques manuales y de
      # cron-job.org (workflow_dispatch) este paso no corre.
      - name: Respaldo - saltar si ya hay dato de hoy
        id: guardia
        if: github.event_name == 'schedule'
        run: |
          HOY=$(TZ=America/Bogota date +%F)
          DIA=$(node -e "console.log(require('./data/latest.json').dia)")
          if [ "$DIA" = "$HOY" ]; then
            echo "saltar=si" >> "$GITHUB_OUTPUT"
            echo "Ya hay dato de hoy ($DIA): el respaldo no corre."
          else
            echo "No hay dato de hoy (ultimo: $DIA): el respaldo corre."
          fi

      - uses: actions/setup-node@v4
        if: steps.guardia.outputs.saltar != 'si'
        with:
          node-version: 22

      - name: Fetch and filter SECOP II
        if: steps.guardia.outputs.saltar != 'si'
        run: node scripts/fetch-secop.mjs

      # pdftotext lee los pliegos en PDF. Se instala un paquete del sistema en vez
      # de agregar dependencias npm, que el repositorio no tiene ni necesita.
      - name: Instalar poppler para leer PDFs
        if: steps.guardia.outputs.saltar != 'si'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils


      # Paquetes de lectura para el boton "Analizar con IA" del tablero: todos los
      # documentos que fijan requisitos, completos, partidos en bloques que caben en
      # una consulta. tesseract lee solo las PAGINAS escaneadas. Un proceso se
      # vuelve a armar solo si cambio su lista de documentos, y hay un tope de
      # minutos: lo que no alcance sigue en la corrida siguiente. Si este paso
      # falla, el resto del radar se publica igual.
      - name: Instalar OCR para paginas escaneadas
        if: steps.guardia.outputs.saltar != 'si'
        run: sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-spa

      - name: Armar paquetes de lectura para la IA
        if: steps.guardia.outputs.saltar != 'si'
        continue-on-error: true
        timeout-minutes: 45
        run: node scripts/paquetes.mjs

      # Va DESPUES de los paquetes: si el proceso ya tiene paquete, extrae los
      # requisitos de ese texto (pliego completo, con OCR) sin volver a bajar
      # nada. Solo descarga los que no tienen paquete (contratacion directa).
      # El cache es permanente: en regimen estable son pocos procesos por dia.
      - name: Analizar requisitos de experiencia
        if: steps.guardia.outputs.saltar != 'si'
        run: node scripts/requisitos.mjs

      - name: Commit updated data
        if: steps.guardia.outputs.saltar != 'si'
        run: |
          git config user.name "secop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: actualizar licitaciones SECOP $(TZ=America/Bogota date +%Y-%m-%d)"
          git pull --rebase
          git push

      # Avisa a la rutina de Claude que publica el tablero y envia el correo, para
      # que corra apenas hay datos nuevos en vez de a una hora fija que el retraso
      # de GitHub hacia llegar antes que el dato. Solo corre si todo lo anterior
      # salio bien. La URL y el token salen del "API trigger" de la rutina en
      # claude.ai/code/routines; si los secretos no estan, se salta sin fallar.
      - name: Avisar a la rutina que publique
        if: steps.guardia.outputs.saltar != 'si'
        env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          if [ -z "$ROUTINE_FIRE_URL" ] || [ -z "$ROUTINE_FIRE_TOKEN" ]; then
            echo "Sin ROUTINE_FIRE_URL / ROUTINE_FIRE_TOKEN: no se avisa a la rutina."
            exit 0
          fi
          DIA=$(node -e "console.log(require('./data/latest.json').dia)")
          curl -fsS --retry 3 --retry-delay 20 -X POST "$ROUTINE_FIRE_URL" \
            -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"Datos de SECOP listos: dia $DIA, commit $(git rev-parse --short HEAD).\"}" \
            -o /dev/null -w "Rutina avisada: HTTP %{http_code}\n"
