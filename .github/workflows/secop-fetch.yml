name: Fetch SECOP II

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch SECOP II matches (last 3 days)
        run: |
          mkdir -p data
          SINCE=$(date -u -d '-3 days' +%Y-%m-%dT00:00:00)
          node scripts/fetch-secop.mjs --since="$SINCE" --limit=1000 > data/latest.json
          cat data/latest.json

      - name: Commit and push if changed
        run: |
          git config user.name "secop-bot"
          git config user.email "actions@github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Actualiza data/latest.json ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
