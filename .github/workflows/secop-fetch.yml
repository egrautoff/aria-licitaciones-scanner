name: SECOP fetch

on:
  schedule:
    # 05:23 UTC = 00:23 America/Bogota. Dos decisiones deliberadas:
    # - El minuto no redondo: GitHub encola las tareas programadas de la hora
    #   en punto y con "0 9" el arranque real se corria entre 3h34 y 6h35.
    # - La hora: es lo mas temprano posible que todavia cae dentro del mismo
    #   dia calendario colombiano (05:00 UTC es medianoche en Bogota). Correr
    #   antes etiquetaria el dato con el dia anterior. Asi el margen contra el
    #   retraso de GitHub es el maximo alcanzable: 8h37 hasta la rutina de las
    #   09:00 Bogota. Entre sep y nov 2026 el arranque real cayo entre las 04:35
    #   y las 08:36 Bogota, creciendo; por eso la rutina no puede ir a las 07:00.
    - cron: "23 5 * * *"
    # Segunda pasada: 09:23 UTC = 04:23 Bogota. Con el peor retraso visto (~8h)
    # llega hacia las 12:40, antes de la rutina de las 14:00 Bogota, que asi ve
    # los procesos publicados durante la manana. A las 11:23 UTC podia llegar
    # despues de esa rutina.
    - cron: "23 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Si GitHub atrasa tanto la primera pasada que se cruza con la segunda, que
# esperen en fila en vez de pisarse al hacer push.
concurrency:
  group: secop-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and filter SECOP II
        run: node scripts/fetch-secop.mjs

      # pdftotext lee los pliegos en PDF. Se instala un paquete del sistema en vez
      # de agregar dependencias npm, que el repositorio no tiene ni necesita.
      - name: Instalar poppler para leer PDFs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils

      # Solo baja documentos de procesos abiertos, dentro del plazo y por encima
      # del piso de valor --- hoy son cuatro de 218 --- y cachea el resultado,
      # asi que en regimen estable son uno o dos procesos nuevos por dia.
      - name: Analizar requisitos de experiencia
        run: node scripts/requisitos.mjs

      - name: Commit updated data
        run: |
          git config user.name "secop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: actualizar licitaciones SECOP $(TZ=America/Bogota date +%Y-%m-%d)"
          git pull --rebase
          git push
