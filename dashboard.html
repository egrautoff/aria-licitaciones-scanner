const CAT_CLASS = {
  "Liferay / Portal": "g-portal",
  "Desarrollo / Fabrica": "g-fabrica",
  "IA / Agentes": "g-ia",
  "Integracion / BUS": "g-integracion",
};
const CAT_STAT_CLASS = {
  "Liferay / Portal": "cat-portal",
  "Desarrollo / Fabrica": "cat-fabrica",
  "IA / Agentes": "cat-ia",
  "Integracion / BUS": "cat-integracion",
};
const CATS = ["Liferay / Portal", "Desarrollo / Fabrica", "IA / Agentes", "Integracion / BUS"];
const FILTER_TAGS = ["Destacado", ...CATS, "Otras oportunidades"];

const ALL_ITEMS = [
  ...DATA.items.map((it) => ({
    ...it,
    tags: [...(it.matched_groups || []), ...(it.destacado ? ["Destacado"] : [])],
  })),
  ...(DATA.oportunidades || []).map((op) => ({
    ...op,
    tags: ["Otras oportunidades"],
    matched_keywords: op.matched_broad_keywords || [],
  })),
].sort((a, b) => (b.fecha_publicacion || "").localeCompare(a.fecha_publicacion || ""));

const state = { search: "", activeCats: new Set() };

function fmtCOP(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 }).format(n);
}
function fmtDate(s) {
  if (!s) return "—";
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString("es-CO", { day: "2-digit", month: "short", year: "numeric" });
}
function isOpen(estado) {
  return /public|present|abiert|convocad|borrador/i.test(estado || "");
}
function norm(s) {
  return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}

function renderMeta() {
  const g = new Date(DATA.generated_at);
  document.getElementById("meta").innerHTML =
    `<strong>${g.toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short" })}</strong><br>última actualización · ventana de ${DATA.window_days} días`;
  document.getElementById("footer").textContent =
    `Fuente: ${DATA.source_dataset}. Se actualiza automáticamente una vez al día. Requisitos habilitantes (capacidad financiera, experiencia, RUP) no están en el dataset abierto — revisar en el enlace de cada proceso.`;
}

function renderStats() {
  const counts = Object.fromEntries(CATS.map((c) => [c, 0]));
  for (const it of DATA.items) for (const g of it.matched_groups) if (counts[g] !== undefined) counts[g]++;
  const destacados = DATA.items.filter((it) => it.destacado).length;
  const oportunidades = (DATA.oportunidades || []).length;
  const tiles = [
    { n: DATA.items.length, l: "Total encontradas", cls: "" },
    { n: destacados, l: "Destacados", cls: "destacados" },
    { n: oportunidades, l: "A explorar", cls: "oportunidades" },
    ...CATS.map((c) => ({ n: counts[c], l: c, cls: CAT_STAT_CLASS[c] })),
  ];
  document.getElementById("stats").innerHTML = tiles
    .map((t) => `<div class="stat ${t.cls}"><div class="n">${t.n}</div><div class="l">${t.l}</div></div>`)
    .join("");
}

function renderChips() {
  const el = document.getElementById("chips");
  el.innerHTML =
    `<button class="chip" id="chip-all" aria-pressed="true">Todas</button>` +
    FILTER_TAGS.map((c) => `<button class="chip" data-cat="${c}" aria-pressed="false">${c}</button>`).join("");

  el.querySelector("#chip-all").addEventListener("click", () => {
    state.activeCats.clear();
    syncChips();
    renderCards();
  });
  el.querySelectorAll("[data-cat]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const c = btn.dataset.cat;
      state.activeCats.has(c) ? state.activeCats.delete(c) : state.activeCats.add(c);
      syncChips();
      renderCards();
    });
  });
}
function syncChips() {
  document.getElementById("chip-all").setAttribute("aria-pressed", String(state.activeCats.size === 0));
  document.querySelectorAll("[data-cat]").forEach((btn) => {
    btn.setAttribute("aria-pressed", String(state.activeCats.has(btn.dataset.cat)));
  });
}

function matchesFilters(it) {
  if (state.activeCats.size && !it.tags.some((t) => state.activeCats.has(t))) return false;
  if (!state.search) return true;
  const haystack = norm(
    `${it.entidad} ${it.descripcion} ${it.unspsc} ${(it.matched_keywords || []).join(" ")} ${it.razon || ""}`,
  );
  return haystack.includes(norm(state.search));
}

function cardHtml(it) {
  const badges = [
    ...(it.matched_groups || []).map((g) => `<span class="badge ${CAT_CLASS[g] || ""}">${g}</span>`),
    ...(it.matched_keywords || []).map((k) => `<span class="badge kw">${k}</span>`),
    ...(it.matched_broad_keywords || []).map((k) => `<span class="badge kw">${k}</span>`),
  ].join("");
  const statusCls = isOpen(it.estado) ? "open" : "closed";
  const cls = ["card", it.destacado ? "destacado" : "", it.razon ? "oportunidad" : ""].filter(Boolean).join(" ");
  return `
  <article class="${cls}">
    <div class="card-main">
      <p class="entidad">${it.entidad || "Entidad no especificada"}</p>
      <p class="descripcion">${it.descripcion || "Sin descripción disponible."}</p>
      <div class="badges">${badges}</div>
      ${it.razon ? `<div class="razon"><b>Por qué podría interesar:</b> ${it.razon}</div>` : ""}
    </div>
    <div class="card-side">
      <span class="pill ${statusCls}">${it.estado || "Sin estado"}</span>
      <span class="valor">${fmtCOP(it.valor)}</span>
      <span>${fmtDate(it.fecha_publicacion)}</span>
      <span class="id-line">${it.id_proceso || "—"}</span>
      <span class="id-line">UNSPSC ${it.unspsc && it.unspsc !== "UNSPECIFIED" ? it.unspsc : "—"}</span>
      ${it.url ? `<a class="go" href="${it.url}" target="_blank" rel="noopener">Ver proceso ↗</a>` : ""}
    </div>
  </article>`;
}

function renderCards() {
  const items = ALL_ITEMS.filter(matchesFilters);
  document.getElementById("count-line").textContent =
    `${items.length} de ${ALL_ITEMS.length} procesos`;

  const host = document.getElementById("cards");
  if (!items.length) {
    host.innerHTML = `<div class="empty">Ningún proceso coincide con ese filtro.</div>`;
    return;
  }

  host.innerHTML = items.map(cardHtml).join("");
}

renderMeta();
renderStats();
renderChips();
renderCards();
document.getElementById("search").addEventListener("input", (e) => {
  state.search = e.target.value;
  renderCards();
});
</script>
