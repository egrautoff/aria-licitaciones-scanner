  "Integracion / BUS": "cat-integracion",
};
const CATS = ["Liferay / Portal", "Desarrollo / Fabrica", "IA / Agentes", "Integracion / BUS"];
// ---------- lo que trae el dato del dia ----------
const ITEMS_DEL_DIA = [
  ...DATA.items.map((it) => ({
    ...it,
    tags: [...(it.matched_groups || []), ...(it.destacado ? ["Destacado"] : [])],
  })),
  ...(DATA.oportunidades || []).map((op) => ({
    ...op,
    tags: ["Otras oportunidades"],
    matched_keywords: op.matched_broad_keywords || [],
  })),
].map((it) => (it.es_nuevo ? { ...it, tags: ["Nuevos", ...it.tags] } : it));

const POR_ID = new Map(ITEMS_DEL_DIA.map((it) => [it.id_proceso, it]));
// El registro de novedades se sembro el 2026-09-15; datos anteriores no traen
// es_nuevo. Cuando falta, el filtro de novedades simplemente no se ofrece.
const HAY_HISTORIAL = ITEMS_DEL_DIA.some((it) => "es_nuevo" in it);

// Seguimiento: lo unico que se conserva de un dia para otro. Vive fuera de la
// pagina (capacidad db) porque la rutina reescribe el bloque DATA cada manana.
// Es compartido: lo que marca una persona lo ven todos en ARIA.
const SEGUIMIENTO = new Map();
let db = null;
let dbListo = false;
let conciliando = false;

const state = { search: "", activeCats: new Set() };

function filtros() {
  return [
    ...(SEGUIMIENTO.size ? ["En seguimiento"] : []),
    ...(HAY_HISTORIAL ? ["Nuevos"] : []),
    "Destacado",
    ...CATS,
    "Otras oportunidades",
  ];
}

function itemsVisibles() {
  const vivos = ITEMS_DEL_DIA.map((it) =>
    SEGUIMIENTO.has(it.id_proceso) ? { ...it, tags: ["En seguimiento", ...it.tags] } : it,
  );
  // Un proceso seguido que ya salio de la ventana de 15 dias se sigue mostrando,
  // reconstruido desde lo ultimo que se supo de el.
  const fuera = [];
  for (const [id, doc] of SEGUIMIENTO) {
    if (POR_ID.has(id)) continue;
    fuera.push({ ...doc, tags: ["En seguimiento"], fuera_de_ventana: true, matched_keywords: [] });
  }
  return [...vivos, ...fuera].sort((a, b) =>
    (b.fecha_publicacion || "").localeCompare(a.fecha_publicacion || ""),
  );
}

// ---------- utilidades ----------
// El seguimiento es texto que escribieron otros visores: nunca se inyecta crudo.
function esc(s) {
  return String(s === null || s === undefined ? "" : s).replace(
    /[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
  );
}
function fmtCOP(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 }).format(n);
}
function fmtDate(s) {
  if (!s) return "—";
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString("es-CO", { day: "2-digit", month: "short", year: "numeric" });
}
// Un dia calendario ("2026-09-15") no es un instante: se formatea fijando el
// mediodia UTC para que no se corra un dia al renderizarse en otro huso.
function fmtDia(dia) {
  if (!dia) return "—";
  const d = new Date(`${String(dia).slice(0, 10)}T12:00:00Z`);
  if (isNaN(d)) return String(dia);
  return d.toLocaleDateString("es-CO", { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" });
}
function fmtDiaCorto(dia) {
  if (!dia) return "—";
  const d = new Date(`${String(dia).slice(0, 10)}T12:00:00Z`);
  if (isNaN(d)) return String(dia);
  return d.toLocaleDateString("es-CO", { day: "2-digit", month: "short", timeZone: "UTC" });
}
function diaBogota(date) {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Bogota",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
  }).format(date);
}
function diasEntre(desde, hasta) {
  const a = Date.parse(`${desde}T00:00:00Z`);
  const b = Date.parse(`${hasta}T00:00:00Z`);
  if (!Number.isFinite(a) || !Number.isFinite(b)) return 0;
  return Math.round((b - a) / 86400000);
}
function isOpen(estado) {
  return /public|present|abiert|convocad|borrador/i.test(estado || "");
}
function norm(s) {
  return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}
function idDoc(id) {
  return String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 200);
}

// ---------- encabezado y aviso de frescura ----------
function renderMeta() {
  const g = new Date(DATA.generated_at);
  document.getElementById("meta").innerHTML =
    `<strong>${esc(g.toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short" }))}</strong><br>última actualización · ventana de ${esc(DATA.window_days)} días`;
  document.getElementById("footer").textContent =
    `Fuente: ${DATA.source_dataset}. Se actualiza automáticamente una vez al día. Requisitos habilitantes (capacidad financiera, experiencia, RUP) no están en el dataset abierto — revisar en el enlace de cada proceso.`;
  renderFrescura();
}

// El fallo que esto hace visible: la rutina puede republicar sin novedad el
// archivo del dia anterior y, hasta ahora, el tablero se veia igual de normal.
function renderFrescura() {
  const el = document.getElementById("frescura");
  const gen = DATA.generated_at ? new Date(DATA.generated_at) : null;
  if (!gen || isNaN(gen)) {
    el.hidden = true;
    return;
  }
  const diaDato = DATA.dia || diaBogota(gen);
  const atraso = diasEntre(diaDato, diaBogota(new Date()));
  if (atraso < 1) {
    el.hidden = true;
    return;
  }
  const cuando = atraso === 1 ? "ayer" : `hace ${atraso} días`;
  el.innerHTML =
    `<span><strong>El radar no se ha actualizado hoy.</strong> Lo que ve son los datos del ` +
    `${esc(fmtDia(diaDato))}, recolectados ${esc(cuando)}. Los procesos publicados después de esa ` +
    `fecha todavía no aparecen.</span>`;
  el.hidden = false;
}

function renderStats() {
  const counts = Object.fromEntries(CATS.map((c) => [c, 0]));
  for (const it of DATA.items) for (const g of it.matched_groups) if (counts[g] !== undefined) counts[g]++;
  const destacados = DATA.items.filter((it) => it.destacado).length;
  const oportunidades = (DATA.oportunidades || []).length;
  const nuevos = ITEMS_DEL_DIA.filter((it) => it.es_nuevo).length;
  const tiles = [
    { n: DATA.items.length, l: "Total encontradas", cls: "" },
    ...(HAY_HISTORIAL ? [{ n: nuevos, l: "Nuevos hoy", cls: nuevos > 0 ? "nuevos" : "" }] : []),
    ...(SEGUIMIENTO.size ? [{ n: SEGUIMIENTO.size, l: "En seguimiento", cls: "seguimiento" }] : []),
    { n: destacados, l: "Destacados", cls: "destacados" },
    { n: oportunidades, l: "A explorar", cls: "oportunidades" },
    ...CATS.map((c) => ({ n: counts[c], l: c, cls: CAT_STAT_CLASS[c] })),
  ];
  document.getElementById("stats").innerHTML = tiles
    .map((t) => `<div class="stat ${t.cls}"><div class="n">${t.n}</div><div class="l">${esc(t.l)}</div></div>`)
    .join("");
}

function renderChips() {
  const disponibles = filtros();
  // Un filtro activo cuyo chip desaparecio dejaria la lista vacia sin explicacion.
  for (const c of [...state.activeCats]) if (!disponibles.includes(c)) state.activeCats.delete(c);

  const el = document.getElementById("chips");
  el.innerHTML =
    `<button class="chip" id="chip-all" aria-pressed="true">Todas</button>` +
    disponibles.map((c) => `<button class="chip" data-cat="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join("");

  el.querySelector("#chip-all").addEventListener("click", () => {
    state.activeCats.clear();
    syncChips();
    renderCards();
  });
  el.querySelectorAll("[data-cat]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const c = btn.dataset.cat;
      state.activeCats.has(c) ? state.activeCats.delete(c) : state.activeCats.add(c);
      syncChips();
      renderCards();
    });
  });
  syncChips();
}
function syncChips() {
  document.getElementById("chip-all").setAttribute("aria-pressed", String(state.activeCats.size === 0));
  document.querySelectorAll("[data-cat]").forEach((btn) => {
    btn.setAttribute("aria-pressed", String(state.activeCats.has(btn.dataset.cat)));
  });
}

function matchesFilters(it) {
  if (state.activeCats.size && !it.tags.some((t) => state.activeCats.has(t))) return false;
  if (!state.search) return true;
  const haystack = norm(
    `${it.entidad} ${it.descripcion} ${it.unspsc} ${(it.matched_keywords || []).join(" ")} ${it.razon || ""}`,
  );
  return haystack.includes(norm(state.search));
}

// ---------- tarjetas ----------
const ETIQUETA_CAMPO = { estado: "Estado", valor: "Valor", modalidad: "Modalidad" };
function valorCampo(campo, v) {
  if (campo === "valor") return fmtCOP(v);
  return v === null || v === undefined || v === "" ? "sin dato" : v;
}

function cambiosHtml(doc) {
  if (!doc) return "";
  const lista = doc.cambios || [];
  if (!lista.length) {
    const desde = doc.marcado_en ? String(doc.marcado_en).slice(0, 10) : doc.visto_en;
    return `<div class="cambios"><b>En seguimiento</b> <span class="sin-cambios">· sin cambios desde el ${esc(fmtDia(desde))}</span></div>`;
  }
  const filas = lista
    .slice()
    .reverse()
    .slice(0, 8)
    .map((c) => {
      // Si nadie abrio el tablero por varios dias solo se sabe que cambio en ese
      // intervalo, no el dia exacto: se dice asi en vez de inventar una fecha.
      const cuando =
        c.desde && c.desde !== c.hasta
          ? `entre el ${fmtDiaCorto(c.desde)} y el ${fmtDiaCorto(c.hasta)}`
          : `el ${fmtDiaCorto(c.hasta)}`;
      return (
        `<li><span class="campo">${esc(ETIQUETA_CAMPO[c.campo] || c.campo)}</span>: ` +
        `${esc(valorCampo(c.campo, c.de))} → ${esc(valorCampo(c.campo, c.a))} ` +
        `<span class="cuando">${esc(cuando)}</span></li>`
      );
    })
    .join("");
  return `<div class="cambios"><b>Cambios desde que lo sigue</b><ul>${filas}</ul></div>`;
}

function cardHtml(it) {
  const sigue = SEGUIMIENTO.has(it.id_proceso);
  const doc = SEGUIMIENTO.get(it.id_proceso);
  const badges = [
    it.es_nuevo ? `<span class="badge nuevo">Nuevo</span>` : "",
    ...(it.matched_groups || []).map((g) => `<span class="badge ${CAT_CLASS[g] || ""}">${esc(g)}</span>`),
    ...(it.matched_keywords || []).map((k) => `<span class="badge kw">${esc(k)}</span>`),
    ...(it.matched_broad_keywords || []).map((k) => `<span class="badge kw">${esc(k)}</span>`),
  ].join("");
  const statusCls = isOpen(it.estado) ? "open" : "closed";
  const cls = [
    "card",
    it.destacado ? "destacado" : "",
    it.razon ? "oportunidad" : "",
    sigue ? "seguida" : "",
    it.fuera_de_ventana ? "fuera" : "",
  ]
    .filter(Boolean)
    .join(" ");
  const estrella = dbListo
    ? `<button class="marcar" type="button" data-id="${esc(it.id_proceso)}" aria-pressed="${sigue}" ` +
      `title="${sigue ? "Dejar de seguir este proceso" : "Seguir este proceso"}" ` +
      `aria-label="${sigue ? "Dejar de seguir" : "Seguir"}">${sigue ? "★" : "☆"}</button>`
    : "";
  return `
  <article class="${cls}">
    <div class="card-main">
      <p class="entidad">${esc(it.entidad || "Entidad no especificada")}</p>
      <p class="descripcion">${esc(it.descripcion || "Sin descripción disponible.")}</p>
      <div class="badges">${badges}</div>
      ${it.razon ? `<div class="razon"><b>Por qué podría interesar:</b> ${esc(it.razon)}</div>` : ""}
      ${sigue ? cambiosHtml(doc) : ""}
      ${
        it.fuera_de_ventana
          ? `<div class="fuera-nota">Ya no aparece en la ventana de ${esc(DATA.window_days)} días. Lo último que se supo de este proceso es del ${esc(fmtDia(doc && doc.visto_en))}.</div>`
          : ""
      }
    </div>
    <div class="card-side">
      <div class="side-top">
        ${estrella}
        <span class="pill ${statusCls}">${esc(it.estado || "Sin estado")}</span>
      </div>
      <span class="valor">${fmtCOP(it.valor)}</span>
      <span>${esc(fmtDate(it.fecha_publicacion))}</span>
      <span class="id-line">${esc(it.id_proceso || "—")}</span>
      <span class="id-line">UNSPSC ${esc(it.unspsc && it.unspsc !== "UNSPECIFIED" ? it.unspsc : "—")}</span>
      ${it.dias_en_radar > 1 ? `<span class="id-line">${esc(it.dias_en_radar)} días en el radar</span>` : ""}
      ${it.url ? `<a class="go" href="${esc(it.url)}" target="_blank" rel="noopener">Ver proceso ↗</a>` : ""}
    </div>
  </article>`;
}

function renderCards() {
  const todos = itemsVisibles();
  const items = todos.filter(matchesFilters);
  document.getElementById("count-line").textContent = `${items.length} de ${todos.length} procesos`;

  const host = document.getElementById("cards");
  if (!items.length) {
    host.innerHTML = `<div class="empty">Ningún proceso coincide con ese filtro.</div>`;
    return;
  }
  host.innerHTML = items.map(cardHtml).join("");
}

function refrescar() {
  renderStats();
  renderChips();
  renderCards();
}

// ---------- seguimiento ----------
async function alternarSeguimiento(id) {
  if (!db) return;
  const ref = db.doc("seguimiento/" + idDoc(id));
  try {
    if (SEGUIMIENTO.has(id)) {
      await ref.delete();
      return;
    }
    const it = POR_ID.get(id);
    if (!it) return;
    await ref.set({
      id_proceso: id,
      entidad: it.entidad || null,
      descripcion: it.descripcion || null,
      url: it.url || null,
      unspsc: it.unspsc || null,
      modalidad: it.modalidad || null,
      estado: it.estado || null,
      valor: it.valor === undefined ? null : it.valor,
      fecha_publicacion: it.fecha_publicacion || null,
      matched_groups: it.matched_groups || [],
      razon: it.razon || null,
      marcado_en: new Date().toISOString(),
      visto_en: DATA.dia || null,
      cambios: [],
    });
  } catch (e) {
    console.warn("No se pudo guardar el seguimiento", e);
  }
}

// SECOP puede reemitir el mismo valor con otra tilde, otro espaciado u otra
// caja. Eso no es un cambio del proceso y avisarlo seria una falsa alarma, asi
// que el texto se compara normalizado --- pero se guarda tal como vino.
function mismoValor(a, b) {
  if (typeof a === "string" || typeof b === "string") {
    const limpiar = (v) => norm(String(v === null || v === undefined ? "" : v)).replace(/\s+/g, " ").trim();
    return limpiar(a) === limpiar(b);
  }
  return a === b;
}

// Compara cada proceso seguido contra el dato de hoy y anota lo que cambio.
// Solo escribe cuando el dia del dato es distinto al ya comparado, asi que la
// reescritura que dispara el propio snapshot termina siendo un no-op.
async function conciliar() {
  if (!db || conciliando || !DATA.dia) return;
  conciliando = true;
  try {
    for (const [id, doc] of [...SEGUIMIENTO]) {
      const hoy = POR_ID.get(id);
      if (!hoy || doc.visto_en === DATA.dia) continue;
      const cambios = [];
      for (const campo of ["estado", "valor", "modalidad"]) {
        const antes = doc[campo] === undefined ? null : doc[campo];
        const ahora = hoy[campo] === undefined ? null : hoy[campo];
        if (!mismoValor(antes, ahora)) {
          cambios.push({ campo, de: antes, a: ahora, desde: doc.visto_en || null, hasta: DATA.dia });
        }
      }
      await db.doc("seguimiento/" + idDoc(id)).update({
        entidad: hoy.entidad || null,
        descripcion: hoy.descripcion || null,
        url: hoy.url || null,
        unspsc: hoy.unspsc || null,
        modalidad: hoy.modalidad || null,
        estado: hoy.estado || null,
        valor: hoy.valor === undefined ? null : hoy.valor,
        fecha_publicacion: hoy.fecha_publicacion || null,
        visto_en: DATA.dia,
        cambios: [...(doc.cambios || []), ...cambios].slice(-50),
      });
    }
  } catch (e) {
    console.warn("No se pudo conciliar el seguimiento", e);
  } finally {
    conciliando = false;
  }
}

async function iniciarSeguimiento() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    db = await window.claude.use("db");
  } catch (e) {
    db = null;
  }
  if (!db) return;
  dbListo = true;
  db.collection("seguimiento").onSnapshot(
    (snap) => {
      SEGUIMIENTO.clear();
      for (const d of snap.docs) {
        const body = d.data();
        if (body && body.id_proceso) SEGUIMIENTO.set(body.id_proceso, body);
      }
      refrescar();
      conciliar();
    },
    () => {
      dbListo = false;
      refrescar();
    },
  );
  refrescar();
}

renderMeta();
refrescar();
document.getElementById("search").addEventListener("input", (e) => {
  state.search = e.target.value;
  renderCards();
});
document.getElementById("cards").addEventListener("click", (e) => {
  const btn = e.target.closest(".marcar");
  if (btn) alternarSeguimiento(btn.dataset.id);
});
iniciarSeguimiento();
</script>

</body></html>
